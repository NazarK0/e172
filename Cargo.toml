[package]
name = "e172"
description = "UI framework for Rust"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/NazarK0/e172"
homepage = "https://github.com/NazarK0/e172"
keywords = ["ui_framework", "gui", "declarative_gui"]
categories = ["gui"]

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "0.4.0"
wgpu = "28.0.0"
winit = "0.30.12"
serde = { version = "1.0", features = ["derive"] }
ron = "0.12.0"
